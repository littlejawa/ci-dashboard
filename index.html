<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSC CI Dashboard</title>
<style>
:root {
  --bg: #f8f9fa; --surface: #fff; --border: #dee2e6; --text: #212529;
  --text-muted: #6c757d; --success: #198754; --failure: #dc3545;
  --pending: #ffc107; --unknown: #adb5bd; --hover: #f1f3f5;
  --accent: #0d6efd; --accent-light: #e7f1ff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px; }
.header h1 { font-size: 20px; font-weight: 600; }
.header .meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

.summary-bar { display: flex; gap: 16px; padding: 16px 24px; flex-wrap: wrap; }
.summary-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 20px; min-width: 120px; text-align: center;
}
.summary-card .value { font-size: 28px; font-weight: 700; }
.summary-card .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.summary-card.success .value { color: var(--success); }
.summary-card.failure .value { color: var(--failure); }

.filters {
  display: flex; gap: 12px; padding: 12px 24px; flex-wrap: wrap; align-items: center;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.filters label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.filters select, .filters input {
  padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px;
  font-size: 13px; background: var(--bg);
}
.filters .filter-group { display: flex; flex-direction: column; gap: 2px; }
.filters .reset-btn {
  padding: 6px 14px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 4px; cursor: pointer; font-size: 13px; align-self: flex-end;
}
.filters .reset-btn:hover { background: var(--border); }

.table-container { padding: 0 24px 24px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
thead th {
  padding: 10px 12px; text-align: left; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted);
  background: var(--bg); border-bottom: 2px solid var(--border); cursor: pointer;
  user-select: none; white-space: nowrap;
}
thead th:hover { color: var(--text); }
thead th .sort-arrow { margin-left: 4px; font-size: 10px; }
tbody tr.build-row { border-bottom: 1px solid var(--border); cursor: pointer; }
tbody tr.build-row:hover { background: var(--hover); }
tbody tr.build-row.expanded { background: var(--accent-light); }
td { padding: 8px 12px; white-space: nowrap; }

.status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.status-dot.success { background: var(--success); }
.status-dot.failure { background: var(--failure); }
.status-dot.error { background: var(--failure); }
.status-dot.timeout { background: var(--pending); }
.status-dot.aborted { background: var(--unknown); }
.status-dot.unknown { background: var(--unknown); }

.cat-badges { display: inline-flex; gap: 3px; }
.cat-badge {
  display: inline-block; width: 20px; height: 20px; border-radius: 3px;
  text-align: center; font-size: 10px; line-height: 20px; font-weight: 700; color: #fff;
}
.cat-badge.SUCCESS { background: var(--success); }
.cat-badge.FAILURE { background: var(--failure); }
.cat-badge.TEST_BUG { background: var(--pending); color: #333; }
.cat-badge.skipped, .cat-badge.not-run, .cat-badge.unknown { background: var(--unknown); }

.pattern-tag {
  display: inline-block; padding: 2px 8px; border-radius: 10px;
  font-size: 11px; font-weight: 600;
}
.pattern-tag.timeout { background: #fff3cd; color: #664d03; }
.pattern-tag.oom { background: #f8d7da; color: #842029; }
.pattern-tag.network { background: #cff4fc; color: #055160; }
.pattern-tag.quota, .pattern-tag.azure_quota { background: #e2e3e5; color: #41464b; }
.pattern-tag.image_pull { background: #cfe2ff; color: #084298; }
.pattern-tag.infrastructure { background: #e2e3e5; color: #41464b; }
.pattern-tag.kata_init, .pattern-tag.rpm_install, .pattern-tag.rpm_cascading { background: #f8d7da; color: #842029; }
.pattern-tag.go_build_failure { background: #fff3cd; color: #664d03; }
.pattern-tag.catalogsource, .pattern-tag.olm_subscription, .pattern-tag.kbs_auth { background: #cff4fc; color: #055160; }
.pattern-tag.default { background: #e2e3e5; color: #41464b; }

.confidence-tag { font-size: 11px; color: var(--text-muted); }
.confidence-tag.high { color: var(--success); }
.confidence-tag.medium { color: var(--pending); }
.confidence-tag.low { color: var(--failure); }

.detail-row td { padding: 0; cursor: default; }
.detail-row:hover { background: var(--surface) !important; }
.detail-panel { padding: 16px 24px; background: var(--bg); border-top: 1px solid var(--border); }
.detail-panel h3 { font-size: 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.detail-panel h3 a { font-size: 12px; font-weight: 400; }
.detail-section { margin-bottom: 16px; }
.detail-section h4 { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }

.cat-table, .tests-table, .artifacts-table {
  width: 100%; border-collapse: collapse; background: var(--surface);
  border-radius: 4px; overflow: hidden; border: 1px solid var(--border);
}
.cat-table th, .tests-table th, .artifacts-table th {
  padding: 6px 10px; font-size: 11px; text-align: left;
  background: var(--surface); border-bottom: 1px solid var(--border); cursor: default;
}
.cat-table td, .tests-table td, .artifacts-table td {
  padding: 6px 10px; font-size: 13px; border-bottom: 1px solid var(--border);
}
.cat-table tr:last-child td, .tests-table tr:last-child td, .artifacts-table tr:last-child td { border-bottom: none; }

.root-cause-box {
  background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
  padding: 12px; font-size: 13px;
}
.root-cause-box .cause-label { font-weight: 600; margin-right: 8px; }

.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
.badge.success, .badge.SUCCESS { background: #d1e7dd; color: #0f5132; }
.badge.failure, .badge.FAILURE { background: #f8d7da; color: #842029; }
.badge.TEST_BUG { background: #fff3cd; color: #664d03; }
.badge.skipped { background: #e2e3e5; color: #41464b; }
.badge.not-run { background: #e2e3e5; color: #6c757d; }

.detail-loading { padding: 20px; text-align: center; color: var(--text-muted); }
.empty-state { text-align: center; padding: 48px; color: var(--text-muted); }
</style>
</head>
<body>

<div class="header">
  <h1>Sandboxed Containers Operator — CI Dashboard</h1>
  <div class="meta" id="meta-info">Loading...</div>
</div>

<div class="summary-bar" id="summary-bar"></div>

<div class="filters">
  <div class="filter-group">
    <label>Provider</label>
    <select id="filter-provider"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label>OCP Version</label>
    <select id="filter-ocp"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label>Workload</label>
    <select id="filter-workload"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label>Status</label>
    <select id="filter-status">
      <option value="">All</option>
      <option value="success">Success</option>
      <option value="failure">Failure</option>
    </select>
  </div>
  <div class="filter-group">
    <label>Root Cause</label>
    <select id="filter-pattern"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label>Search</label>
    <input type="text" id="filter-search" placeholder="Job name or build ID...">
  </div>
  <button class="reset-btn" onclick="resetFilters()">Reset</button>
</div>

<div class="table-container">
  <table id="builds-table">
    <thead>
      <tr>
        <th data-sort="status" style="width:40px"></th>
        <th data-sort="start_time">Date</th>
        <th data-sort="provider">Provider</th>
        <th data-sort="ocp_version">OCP</th>
        <th data-sort="workload_type">Workload</th>
        <th data-sort="catalog">Catalog</th>
        <th>Categories</th>
        <th data-sort="primary_pattern">Root Cause</th>
        <th data-sort="tests_failed">Tests</th>
        <th data-sort="duration_seconds">Duration</th>
      </tr>
    </thead>
    <tbody id="builds-body"></tbody>
  </table>
  <div class="empty-state" id="empty-state" style="display:none">No builds match the current filters.</div>
</div>

<script>
const CAT_KEYS = ["infra", "overall", "smoke", "osc", "kata_upstream", "caa"];
const CAT_LABELS = { infra: "I", overall: "O", smoke: "S", osc: "OSC", kata_upstream: "K", caa: "C" };
const CAT_NAMES = { infra: "Infrastructure", overall: "Overall", smoke: "Smoke", osc: "OSC", kata_upstream: "Kata Upstream", caa: "CAA" };

let manifest = null;
let sortCol = "start_time";
let sortAsc = false;
let expandedBuild = null;
let detailCache = {};

async function loadManifest() {
  try {
    const resp = await fetch("results/manifest.json");
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    manifest = await resp.json();
    initDashboard();
  } catch (e) {
    document.getElementById("meta-info").textContent =
      `Error loading manifest: ${e.message}. Run collect.sh first.`;
  }
}

function initDashboard() {
  const genDate = new Date(manifest.generated_at);
  document.getElementById("meta-info").textContent =
    `Last updated: ${genDate.toLocaleString()} · ${manifest.total_entries} builds`;

  populateFilters();
  renderSummary();
  renderTable();

  document.querySelectorAll("thead th[data-sort]").forEach(th => {
    th.addEventListener("click", () => {
      const col = th.dataset.sort;
      if (sortCol === col) sortAsc = !sortAsc; else { sortCol = col; sortAsc = col !== "start_time"; }
      renderTable();
    });
  });
  document.querySelectorAll(".filters select, .filters input").forEach(el => {
    el.addEventListener("input", () => { renderSummary(); renderTable(); });
  });
}

function populateFilters() {
  const sets = { provider: new Set(), ocp: new Set(), workload: new Set(), pattern: new Set() };
  manifest.entries.forEach(e => {
    if (e.provider) sets.provider.add(e.provider);
    if (e.ocp_version) sets.ocp.add(e.ocp_version);
    if (e.workload_type) sets.workload.add(e.workload_type);
    if (e.primary_pattern) sets.pattern.add(e.primary_pattern);
  });
  fillSelect("filter-provider", sorted(sets.provider));
  fillSelect("filter-ocp", sorted(sets.ocp));
  fillSelect("filter-workload", sorted(sets.workload));
  fillSelect("filter-pattern", sorted(sets.pattern));
}

function fillSelect(id, values) {
  const sel = document.getElementById(id);
  values.forEach(v => { const o = document.createElement("option"); o.value = v; o.textContent = v; sel.appendChild(o); });
}

function sorted(set) { return [...set].sort(); }

function getFiltered() {
  const fp = document.getElementById("filter-provider").value;
  const fo = document.getElementById("filter-ocp").value;
  const fw = document.getElementById("filter-workload").value;
  const fs = document.getElementById("filter-status").value;
  const fr = document.getElementById("filter-pattern").value;
  const fq = document.getElementById("filter-search").value.toLowerCase();
  return manifest.entries.filter(e =>
    (!fp || e.provider === fp) &&
    (!fo || e.ocp_version === fo) &&
    (!fw || e.workload_type === fw) &&
    (!fs || e.status === fs) &&
    (!fr || e.primary_pattern === fr) &&
    (!fq || e.job_name.toLowerCase().includes(fq) || e.build_id.includes(fq))
  );
}

function renderSummary() {
  const builds = getFiltered();
  const total = builds.length;
  const passing = builds.filter(b => b.status === "success").length;
  const failing = builds.filter(b => b.status === "failure").length;

  const patterns = {};
  builds.forEach(b => { if (b.primary_pattern) patterns[b.primary_pattern] = (patterns[b.primary_pattern] || 0) + 1; });
  const topPattern = Object.entries(patterns).sort((a, b) => b[1] - a[1])[0];

  document.getElementById("summary-bar").innerHTML = `
    <div class="summary-card"><div class="value">${total}</div><div class="label">Builds</div></div>
    <div class="summary-card success"><div class="value">${passing}</div><div class="label">Passing</div></div>
    <div class="summary-card failure"><div class="value">${failing}</div><div class="label">Failing</div></div>
    <div class="summary-card"><div class="value">${total > 0 ? Math.round(passing / total * 100) : 0}%</div><div class="label">Pass Rate</div></div>
    ${topPattern ? `<div class="summary-card"><div class="value" style="font-size:18px">${esc(topPattern[0])}</div><div class="label">Top failure (${topPattern[1]}x)</div></div>` : ""}
  `;
}

function renderTable() {
  const builds = getFiltered();
  const tbody = document.getElementById("builds-body");
  const empty = document.getElementById("empty-state");

  if (builds.length === 0) { tbody.innerHTML = ""; empty.style.display = ""; return; }
  empty.style.display = "none";

  builds.sort((a, b) => {
    let va, vb;
    if (sortCol === "start_time") { va = a.start_time || ""; vb = b.start_time || ""; }
    else if (sortCol === "duration_seconds") { va = a.duration_seconds || 0; vb = b.duration_seconds || 0; }
    else if (sortCol === "tests_failed") { va = a.tests_failed || 0; vb = b.tests_failed || 0; }
    else { va = a[sortCol] || ""; vb = b[sortCol] || ""; }
    if (typeof va === "string") { va = va.toLowerCase(); vb = vb.toLowerCase(); }
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });

  document.querySelectorAll("thead th[data-sort]").forEach(th => {
    const arrow = th.querySelector(".sort-arrow") || document.createElement("span");
    arrow.className = "sort-arrow";
    arrow.textContent = th.dataset.sort === sortCol ? (sortAsc ? "▲" : "▼") : "";
    if (!th.querySelector(".sort-arrow")) th.appendChild(arrow);
  });

  tbody.innerHTML = "";
  builds.forEach(b => {
    const tr = document.createElement("tr");
    tr.className = "build-row";

    const testStr = b.tests_total > 0
      ? `${b.tests_passed}/${b.tests_total}${b.tests_failed > 0 ? ` <span style="color:var(--failure)">(${b.tests_failed} fail)</span>` : ""}`
      : "—";

    tr.innerHTML = `
      <td><span class="status-dot ${b.status}"></span></td>
      <td title="${b.start_time}">${formatDate(b.start_time)}</td>
      <td>${esc(b.provider || "—")}</td>
      <td>${esc(b.ocp_version || "—")}</td>
      <td>${esc(b.workload_type || "—")}</td>
      <td>${esc(b.catalog || "—")}</td>
      <td>${categoriesHtml(b.categories)}</td>
      <td>${patternHtml(b.primary_pattern, b.confidence)}</td>
      <td>${testStr}</td>
      <td>${formatDuration(b.duration_seconds)}</td>
    `;
    tr.addEventListener("click", () => toggleDetail(b));
    tbody.appendChild(tr);

    if (expandedBuild === b.build_id) {
      tr.classList.add("expanded");
      tbody.appendChild(createDetailRow(b));
    }
  });
}

function categoriesHtml(cats) {
  if (!cats) return "—";
  return `<span class="cat-badges">${CAT_KEYS.map(k => {
    const st = (cats[k] || "unknown").replace(/ /g, "-");
    return `<span class="cat-badge ${st}" title="${CAT_NAMES[k]}: ${cats[k] || "unknown"}">${CAT_LABELS[k]}</span>`;
  }).join("")}</span>`;
}

function patternHtml(pattern, confidence) {
  if (!pattern) return "—";
  const cls = pattern.replace(/[^a-zA-Z0-9_]/g, "_");
  return `<span class="pattern-tag ${cls} default">${esc(pattern)}</span>` +
    (confidence ? ` <span class="confidence-tag ${confidence}">${confidence}</span>` : "");
}

function toggleDetail(build) {
  expandedBuild = expandedBuild === build.build_id ? null : build.build_id;
  renderTable();
  if (expandedBuild && !detailCache[build.build_id]) loadDetail(build);
}

function createDetailRow(build) {
  const tr = document.createElement("tr");
  tr.className = "detail-row";
  const td = document.createElement("td");
  td.colSpan = 10;
  const detail = detailCache[build.build_id];
  td.innerHTML = detail
    ? renderDetail(build, detail)
    : `<div class="detail-loading">Loading detailed analysis…</div>`;
  tr.appendChild(td);
  return tr;
}

async function loadDetail(build) {
  try {
    const resp = await fetch(`results/${build.file}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    detailCache[build.build_id] = await resp.json();
  } catch (e) {
    detailCache[build.build_id] = { _error: e.message };
  }
  if (expandedBuild === build.build_id) renderTable();
}

function renderDetail(build, detail) {
  if (detail._error) return `<div class="detail-panel"><p>Error loading details: ${esc(detail._error)}</p></div>`;

  const pj = detail.prowjob || {};
  const fa = detail.failure_analysis || {};
  const rc = detail.root_cause || fa.root_cause || {};
  const cats = detail.result_categories || {};
  const arts = detail.artifacts || {};
  const suites = detail.testsuites || {};
  const variant = build.variant || (detail.metadata || {}).variant || "";

  let html = `<div class="detail-panel">`;

  html += `<h3>${esc(variant || build.job_name)}
    <a href="${esc(pj.url || "")}" target="_blank">Prow →</a>
    <span style="font-size:12px;color:var(--text-muted)">Build ${esc(build.build_id)}</span>
  </h3>`;

  // Catalog info
  const md = detail.metadata || {};
  const catalogTag = md.catalog_full_tag || "";
  const catalogVer = md.catalog_version || "";
  const catalogDate = md.catalog_build_date || "";
  if (catalogTag || catalogVer) {
    html += `<div class="detail-section" style="margin-bottom:12px">
      <table class="cat-table" style="width:auto">
        <tr><td style="font-weight:600">Catalog</td><td>${esc(catalogTag || catalogVer)}</td></tr>
        ${catalogDate && catalogDate !== "not set" ? `<tr><td style="font-weight:600">Catalog built</td><td>${esc(catalogDate)}</td></tr>` : ""}
        ${md.kata_rpm_version ? `<tr><td style="font-weight:600">Kata RPM</td><td>${esc(md.kata_rpm_version)}</td></tr>` : ""}
        ${md.expected_operator_version ? `<tr><td style="font-weight:600">Operator version</td><td>${esc(md.expected_operator_version)}</td></tr>` : ""}
      </table>
    </div>`;
  }

  // Category breakdown
  html += `<div class="detail-section"><h4>Result Categories</h4>
    <table class="cat-table"><thead><tr><th>Category</th><th>Status</th><th>Time</th><th>Pattern</th><th>Root Cause</th></tr></thead><tbody>`;
  for (const key of CAT_KEYS) {
    const c = cats[key] || {};
    const st = c.status || "unknown";
    html += `<tr>
      <td><strong>${esc(CAT_NAMES[key])}</strong></td>
      <td><span class="badge ${st.replace(/ /g, "-")}">${esc(st)}</span></td>
      <td>${formatHHMM(c.time)}</td>
      <td>${c.primary_pattern ? `<span class="pattern-tag default ${c.primary_pattern}">${esc(c.primary_pattern)}</span>` : "—"}</td>
      <td style="white-space:normal;max-width:400px">${esc(c.root_cause || "—")}</td>
    </tr>`;
  }
  html += `</tbody></table></div>`;

  // Root cause
  if (rc.primary_pattern) {
    html += `<div class="detail-section"><h4>Root Cause Analysis</h4>
      <div class="root-cause-box">
        <span class="cause-label">Pattern:</span> <span class="pattern-tag default ${rc.primary_pattern}">${esc(rc.primary_pattern)}</span>
        <span class="confidence-tag ${rc.confidence || ""}" style="margin-left:8px">${esc(rc.confidence || "")}</span><br>
        <span class="cause-label">Cause:</span> ${esc(rc.likely_cause || "—")}
        ${rc.suggested_actions?.length ? `<br><span class="cause-label">Suggested:</span> ${rc.suggested_actions.map(esc).join("; ")}` : ""}
      </div></div>`;
  }

  // Failing tests
  const failingTests = fa.failing_tests || [];
  if (failingTests.length > 0) {
    html += `<div class="detail-section"><h4>Failing Tests (${failingTests.length})</h4>
      <table class="tests-table"><thead><tr><th>Test</th><th>Suite</th><th>Case #</th><th>Duration</th></tr></thead><tbody>`;
    for (const t of failingTests) {
      html += `<tr>
        <td style="white-space:normal;max-width:500px">${esc(t.name || t.description || "—")}</td>
        <td>${esc(t.suite || "—")}</td>
        <td>${esc(t.test_case_number || "—")}</td>
        <td>${t.duration != null ? t.duration.toFixed(1) + "s" : "—"}</td>
      </tr>`;
    }
    html += `</tbody></table></div>`;
  }

  // Per-suite detail
  const suiteKeys = Object.keys(suites).filter(k => suites[k].step_exists);
  if (suiteKeys.length > 0) {
    html += `<div class="detail-section"><h4>Test Suites</h4>
      <table class="cat-table"><thead><tr><th>Suite</th><th>Status</th><th>Tests</th><th>Passed</th><th>Failed</th><th>Skipped</th><th>Time</th></tr></thead><tbody>`;
    for (const k of suiteKeys) {
      const s = suites[k];
      const st = s.status || "unknown";
      html += `<tr>
        <td><strong>${esc(k)}</strong><br><span style="font-size:11px;color:var(--text-muted)">${esc(s.step_name || "")}</span></td>
        <td><span class="badge ${st}">${esc(st)}</span>${s.is_test_bug ? ' <span class="badge TEST_BUG">test bug</span>' : ""}</td>
        <td>${s.tests ?? "—"}</td><td>${s.passed ?? "—"}</td>
        <td>${s.failures ? `<strong style="color:var(--failure)">${s.failures}</strong>` : (s.failures ?? "—")}</td>
        <td>${s.skipped ?? "—"}</td><td>${formatHHMM(s.elapsed_time)}</td>
      </tr>`;
    }
    html += `</tbody></table></div>`;
  }

  // Artifacts
  const artLinks = Object.entries(arts).filter(([, v]) => v);
  if (artLinks.length > 0) {
    html += `<div class="detail-section"><h4>Artifacts</h4>
      <table class="artifacts-table"><tbody>`;
    for (const [name, url] of artLinks) {
      html += `<tr><td>${esc(name)}</td><td><a href="${esc(url)}" target="_blank">${esc(url.split("/").slice(-2).join("/"))}</a></td></tr>`;
    }
    html += `</tbody></table></div>`;
  }

  html += `</div>`;
  return html;
}

function formatHHMM(t) {
  if (!t || t === "unknown") return "—";
  const m = t.match(/^(\d+):(\d+)$/);
  if (!m) return esc(t);
  const h = parseInt(m[1]), min = parseInt(m[2]);
  if (h > 0) return `${h}h ${min}m`;
  return `${min}m`;
}

function formatDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString("en-CA") + " " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
}

function formatDuration(seconds) {
  if (!seconds) return "—";
  const m = Math.floor(seconds / 60);
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60);
  return `${h}h ${m % 60}m`;
}

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function resetFilters() {
  document.querySelectorAll(".filters select").forEach(s => s.value = "");
  document.getElementById("filter-search").value = "";
  renderSummary(); renderTable();
}

loadManifest();
</script>
</body>
</html>
